name: Persist Maitte idle Adobe assets

on:
  push:
    branches:
      - feat/maitte-idle-curious-prebuild
    paths:
      - .github/workflows/persist-maitte-idle-assets.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/maitte-idle-curious-prebuild
          fetch-depth: 0

      - name: Download audited Adobe outputs
        shell: bash
        run: |
          set -euo pipefail
          dest="src/assets/game/characters/production-proof"
          mkdir -p "$dest"

          download() {
            local name="$1"
            local url="$2"
            echo "Downloading $name"
            curl -fL --retry 2 --retry-delay 1 --connect-timeout 20 --max-time 120 \
              -o "$dest/$name" "$url"
            test "$(xxd -p -l 8 "$dest/$name")" = "89504e470d0a1a0a"
          }

          download maitte-idle-curious-full-color.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9bf49cb2-28e1-4950-b07f-8e5e3e800c75'
          download maitte-idle-curious-mask-heart.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:da7be124-3fe6-46f0-94a4-8a335ef5ef26'
          download maitte-idle-curious-mask-glasses.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9e184745-3f31-4c57-b425-2f50068a2933'
          download maitte-idle-curious-mask-hair-streak.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:be16d0e0-0886-4b5c-b23f-24bbd844b4f9'
          download maitte-idle-curious-mask-hair.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:856fcd82-345d-44bb-a9bc-cd4971883901'
          download maitte-idle-curious-mask-shirt.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:71e1a573-2a00-4cec-9fa0-664b582af0bf'
          download maitte-idle-curious-mask-skirt.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:6823bda6-d4c1-45f9-a562-70e96e9d1b6b'
          download maitte-idle-curious-mask-socks.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5fefd5ce-b467-4917-8c69-eeb33fd0eac2'
          download maitte-idle-curious-mask-shoes.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:f27ab1ba-345c-4301-b557-3ae166d84854'
          download maitte-idle-curious-mask-eyes-pupil.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:da1eb683-44e2-4adc-944f-310edd2e00ea'
          download maitte-idle-curious-blink-underlay.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:ceb7e3fc-7ea5-4ce6-b860-7098115c4ccb'

          sha256sum "$dest"/maitte-idle-curious-*.png > references/visual/19-maitte-overworld-main/RUNTIME-ASSET-SHA256.txt

      - name: Record transport provenance
        shell: bash
        run: |
          cat > references/visual/19-maitte-overworld-main/ASSET-PERSISTENCE.md <<'EOF'
          # Maittê idle-curious — Runtime Asset Persistence

          **Status:** PERSISTED ON PRE-BUILD FEATURE BRANCH

          The Gate 2A / Gate 2B Adobe outputs were transferred from their audited Photoshop API outputs into repository-native PNG files by a one-time GitHub Actions transport job.

          Runtime asset directory:

          `src/assets/game/characters/production-proof/`

          Persisted package:

          - `maitte-idle-curious-full-color.png`
          - `maitte-idle-curious-mask-heart.png`
          - `maitte-idle-curious-mask-glasses.png`
          - `maitte-idle-curious-mask-hair-streak.png`
          - `maitte-idle-curious-mask-hair.png`
          - `maitte-idle-curious-mask-shirt.png`
          - `maitte-idle-curious-mask-skirt.png`
          - `maitte-idle-curious-mask-socks.png`
          - `maitte-idle-curious-mask-shoes.png`
          - `maitte-idle-curious-mask-eyes-pupil.png`
          - `maitte-idle-curious-blink-underlay.png`

          Integrity hashes are recorded in `RUNTIME-ASSET-SHA256.txt`.

          The Adobe Firefly Boards remain evidence/review artifacts only and are not runtime dependencies.

          Known mask precision notes from Gate 2A remain binding for final production promotion, especially glasses and hairStreak.
          EOF

      - name: Commit assets and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/persist-maitte-idle-assets.yml
          git add src/assets/game/characters/production-proof references/visual/19-maitte-overworld-main/ASSET-PERSISTENCE.md references/visual/19-maitte-overworld-main/RUNTIME-ASSET-SHA256.txt
          git commit -m "assets: persist Maitte idle-curious Adobe package"
          git push origin HEAD:feat/maitte-idle-curious-prebuild
