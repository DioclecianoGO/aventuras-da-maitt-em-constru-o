name: Apply audited M5 Lyra integration

on:
  push:
    branches:
      - feat/step2b-m5-lyra-integration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose transport hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .m5/part*.txt
          wc -c .m5/part*.txt
          cat .m5/part00.txt .m5/part01.txt .m5/part02.txt .m5/part03.txt .m5/part04.txt .m5/part05.txt .m5/part06.txt .m5/part07.txt .m5/part08.txt .m5/part09.txt > /tmp/step2bm5.patch
          sha256sum /tmp/step2bm5.patch
          wc -c /tmp/step2bm5.patch
          exit 1
