name: Apply Step 2B-M2 audited patch

on:
  push:
    branches:
      - feat/step2b-m2-burpee-companion-actor-seam

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/step2b-m2/part*.patch > /tmp/step2b-m2.patch
          echo "b2db9cd9878b4e2c6c7ea0d4d8a000fd6a606b58816d8f5da863663c11c12463  /tmp/step2b-m2.patch" | sha256sum -c -
          git apply --check /tmp/step2b-m2.patch
          git apply /tmp/step2b-m2.patch

      - name: Remove transport artifacts and verify exact scope
        shell: bash
        env:
          BASE_SHA: 0be59f2e7df6feb2516eadd6e1603a04c8a9ffb4
        run: |
          set -euo pipefail
          rm -rf .integration/step2b-m2
          rm -f .github/workflows/apply-step2b-m2.yml
          git add -A

          cat > /tmp/expected-files.txt <<'EOF'
          src/visual/__tests__/assetRegistry.test.ts
          src/visual/assetRegistry.tsx
          src/visual/character/BurpeeActor.tsx
          src/visual/character/CompanionActor.tsx
          src/visual/character/__tests__/BurpeeActor.scaffold-unchanged.test.tsx
          src/visual/character/__tests__/BurpeeActor.test.tsx
          src/visual/character/__tests__/CompanionActor.scaffold-unchanged.test.tsx
          src/visual/character/__tests__/CompanionActor.test.tsx
          src/visual/character/__tests__/dependency-direction.test.ts
          src/visual/stage/ChallengeStageShell.tsx
          src/visual/stage/__tests__/ChallengeStageShell.companion-actor.test.tsx
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --cached --name-only "$BASE_SHA" | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          test "$(git diff --cached --numstat "$BASE_SHA" | awk '{a+=$1; d+=$2} END {print a+0, d+0}')" = "447 2"

      - name: Commit exact audited tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add Burpee companion actor seam"
          git push origin HEAD:${GITHUB_REF_NAME}
